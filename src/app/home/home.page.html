<app-header titulo="PokéMarket" subtitulo="Catálogo Oficial de Cartas Pokémon"></app-header>

<ion-content class="ion-padding">
  <h2 class="ion-text-center">Cartas Destacadas</h2>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="3" *ngFor="let itemCarta of listaCartas">
        <app-carta-item [carta]="itemCarta"></app-carta-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
