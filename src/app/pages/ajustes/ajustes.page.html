<ion-header [translucent]="true">
  <ion-toolbar>
    <div slot="start">
      <!-- Botón para volver automáticamente a la Home -->
      <a href="/home.page.ts" aria-label="Volver a inicio">←</a>
    </div>
    <ion-title>Ajustes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Header colapsable adaptado para iOS -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Ajustes</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Lista de configuración de la app -->
  <ion-list>
    <h2 class="ion-padding-start">Apariencia</h2>
    <ion-item>
      <label>Modo Oscuro</label>
      <!-- Enlazamos la propiedad checked con el servicio y capturamos el evento ionChange -->
      <input type="checkbox" role="switch" aria-label="Modo Oscuro"
        (change)="onToggleChange($any({ detail: { checked: $any($event.target).checked } }))">
    </ion-item>
  </ion-list>
</ion-content>
